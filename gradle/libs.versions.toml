[versions]
jda = "6.7.0"
javalin = "6.7.0"
junit = "6.1.3"
ktlint = "1.8.0"
commons-text = "1.15.0"
guava = "33.8.0-jre"
jackson = "2.23.0"
jsr305 = "3.0.2"
mockito = "5.24.0"
palantir = "2.103.0"
publishdata = "1.4.0"
spotless = "8.11.0"

[libraries]
jda = { module = "net.dv8tion:JDA", version.ref = "jda" }
apache-commons-text = { module = "org.apache.commons:commons-text", version.ref = "commons-text" }
google-guava = { module = "com.google.guava:guava", version.ref = "guava" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
javalin-core = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-openapi = { module = "io.javalin.community.openapi:javalin-openapi-plugin", version.ref = "javalin" }
javalin-openapi-annotation = { module = "io.javalin.community.openapi:openapi-annotation-processor", version.ref = "javalin" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-launcher = { module = "org.junit.platform:junit-platform-launcher" }
jsr305 = { module = "com.google.code.findbugs:jsr305", version.ref = "jsr305" }
mockito-core = { module = "org.mockito:mockito-core", version.ref = "mockito" }

[bundles]
javalin = ["javalin-core", "javalin-openapi"]

[plugins]
publishdata = { id = "de.chojo.publishdata", version.ref = "publishdata" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
